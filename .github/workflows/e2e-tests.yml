name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies and build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install e2e test dependencies
        run: |
          cd e2e-tests
          npm install

      - name: Install Playwright browsers
        run: |
          cd e2e-tests
          npx playwright install --with-deps chromium firefox webkit

      - name: Allocate backend port
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import socket
          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              port = sock.getsockname()[1]
          print(f"LOTSPOT_BACKEND_PORT={port}")
          print(f"LOTSPOT_BASE_URL=http://127.0.0.1:{port}")
          PY

      - name: Start backend server
        run: |
          source venv/bin/activate
          cd backend
          LOTSPOT_POS_API_KEY=demo-pos-key LOTSPOT_SSE_HEARTBEAT=2 uvicorn app:app --host 127.0.0.1 --port "$LOTSPOT_BACKEND_PORT" > /tmp/backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fs "http://127.0.0.1:${LOTSPOT_BACKEND_PORT}/api/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy on port ${LOTSPOT_BACKEND_PORT}" >&2
          exit 1

      - name: Run E2E tests
        run: |
          cd e2e-tests
          npx playwright test --reporter=list --reporter=html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          tail -50 /tmp/backend.log || echo "No backend logs found"
