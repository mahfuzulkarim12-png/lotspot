[pytest]
testpaths = .
addopts = -q --strict-markers
markers =
    docker: needs a reachable Docker daemon (builds/runs the preview image)
    network: reaches the public internet (DNS + TLS against bohor.com.au)
    trivy: needs the trivy CLI and a populated vulnerability DB
    deploy_gate: asserts the PUBLIC preview slug is live; fails until the
        Cloudflare origin binding for *-preview.bohor.com.au exists.
        Deselect with -m "not deploy_gate" until that infra lands.
    slow: multi-minute soak/chaos test, excluded from the fast loop
