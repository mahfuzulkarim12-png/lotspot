; Root pytest config.
;
; A bare `pytest` here runs the FAST backend tier only. The deploy/ops tier
; (Docker, TLS, k6 soak, chaos) is opt-in because it takes minutes and needs a
; running Docker daemon:
;
;   cd deploy/tests && python -m pytest                    # full deploy tier
;   cd deploy/tests && python -m pytest -m "not slow"      # fast subset
;
; Markers are registered here too so root-level collection of deploy/tests
; (e.g. `pytest deploy/tests`) does not warn. See docs/CI_CD_PIPELINE.md.

[pytest]
testpaths = backend/tests
addopts = -q --strict-markers
markers =
    docker: needs a reachable Docker daemon (runs the preview image)
    network: reaches the public internet (DNS + TLS against bohor.com.au)
    trivy: needs the trivy CLI and a populated vulnerability DB
    slow: multi-minute soak/chaos test, excluded from the fast loop
    deploy_gate: asserts the PUBLIC preview slug is live; fails until the
        Cloudflare origin binding for *-preview.bohor.com.au exists.
        Deselect with -m "not deploy_gate" until that infra lands.
